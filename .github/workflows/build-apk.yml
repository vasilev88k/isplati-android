name: Build Исплати APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q isplati-v20-android-github.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -type f -name build.gradle | head -1 | xargs dirname)
          echo "Found: $ANDROID_DIR"

      - name: Build APK
        run: |
          ANDROID_DIR=$(find extracted -type f -name build.gradle | head -1 | xargs dirname)
          cd "$ANDROID_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: isplati-apk
          path: extracted/**/android/app/build/outputs/apk/debug/app-debug.apk
