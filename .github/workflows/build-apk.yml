name: Build Исплати APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project and build APK
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' | head -1 || true)

          if [ -n "$ZIP_FILE" ]; then
            rm -rf extracted
            mkdir extracted
            unzip -q "$ZIP_FILE" -d extracted
          fi

          ANDROID_DIR=$(find . -type f -path '*/android/settings.gradle' -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR"

          touch "$ANDROID_DIR/gradle.properties"
          grep -qxF 'android.useAndroidX=true' "$ANDROID_DIR/gradle.properties" || echo 'android.useAndroidX=true' >> "$ANDROID_DIR/gradle.properties"

          find "$ANDROID_DIR" -type f -name themes.xml -exec sed -i 's/Theme.AppCompat.DayNight.NoActionBar/android:style\/Theme.Material.Light.NoActionBar/g' {} +

          APP_GRADLE="$ANDROID_DIR/app/build.gradle"

          cat >> "$APP_GRADLE" <<'EOF'

          // Force Java and Kotlin to use the same JVM target.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 17
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cd "$ANDROID_DIR"

          echo "Final app/build.gradle:"
          cat app/build.gradle

          gradle --no-daemon clean assembleDebug

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: isplati-v20-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
