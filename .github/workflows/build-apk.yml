name: Build Исплати APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' | head -1)
          echo "ZIP_FILE=$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find extracted -type f -name settings.gradle -print -quit | xargs dirname)
          APP_GRADLE="$ANDROID_DIR/app/build.gradle"

          echo "ANDROID_DIR=$ANDROID_DIR"

          touch "$ANDROID_DIR/gradle.properties"
          grep -qxF 'android.useAndroidX=true' "$ANDROID_DIR/gradle.properties" || echo 'android.useAndroidX=true' >> "$ANDROID_DIR/gradle.properties"

          find "$ANDROID_DIR" -type f -name themes.xml -exec sed -i 's/Theme.AppCompat.DayNight.NoActionBar/android:style\/Theme.Material.Light.NoActionBar/g' {} +

          # The project compiles Java at 1.8. Match Kotlin to Java 1.8.
          cat >> "$APP_GRADLE" <<'EOF'

          // Match Kotlin JVM target to Android Java target.
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          EOF

          echo "----- FINAL app/build.gradle -----"
          cat "$APP_GRADLE"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: isplati-v20-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
