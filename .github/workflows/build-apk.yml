name: Build Исплати APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' | head -1)
          echo "ZIP_FILE=$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Prepare build settings
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find extracted -type f -name settings.gradle -print -quit | xargs dirname)
          APP_GRADLE="$ANDROID_DIR/app/build.gradle"

          echo "ANDROID_DIR=$ANDROID_DIR"

          touch "$ANDROID_DIR/gradle.properties"
          grep -qxF 'android.useAndroidX=true' "$ANDROID_DIR/gradle.properties" || echo 'android.useAndroidX=true' >> "$ANDROID_DIR/gradle.properties"

          find "$ANDROID_DIR" -type f -name themes.xml -exec sed -i 's/Theme.AppCompat.DayNight.NoActionBar/android:style\/Theme.Material.Light.NoActionBar/g' {} +

          # Replace every possible Java 1.8 setting with Java 17.
          find "$ANDROID_DIR" -type f -name '*.gradle' -exec sed -i             -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g'             -e 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g'             -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*[^[:space:]]*/sourceCompatibility JavaVersion.VERSION_17/g'             -e 's/targetCompatibility[[:space:]]*=[[:space:]]*[^[:space:]]*/targetCompatibility JavaVersion.VERSION_17/g'             -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'"'"']1\.8["'"'"']/jvmTarget = "17"/g' {} +

          # Add a final override inside the app module.
          cat >> "$APP_GRADLE" <<'EOF'

          // Final JVM 17 compatibility override.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 17
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "----- FINAL app/build.gradle -----"
          cat "$APP_GRADLE"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: isplati-v20-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
