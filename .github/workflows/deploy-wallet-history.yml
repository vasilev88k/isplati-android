
name: Deploy Исплати to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-wallet-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --name isplati-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
